name: Security CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    name: Node app tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeba8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run application tests
        run: npm test

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Install Semgrep OSS
        run: python -m pip install semgrep==1.186.0
      - name: Test Semgrep rules
        run: semgrep --test rules/
      - name: Scan application
        id: semgrep-scan
        continue-on-error: true
        run: semgrep scan --config rules/ --error --json --output semgrep.json server/ public/
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-report
          path: semgrep.json
          if-no-files-found: warn
      - name: Enforce Semgrep scan result
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.semgrep-scan.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" != "success" ]; then
            echo "Semgrep scan failed (outcome: $SCAN_OUTCOME)"
            exit 1
          fi

  trivy:
    name: Trivy SCA
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan dependencies with Trivy
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy.json
          exit-code: "1"
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-report
          path: trivy.json
          if-no-files-found: warn
      - name: Enforce Trivy scan result
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.trivy-scan.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" != "success" ]; then
            echo "Trivy scan failed or vulnerabilities were found (outcome: $SCAN_OUTCOME)"
            exit 1
          fi
